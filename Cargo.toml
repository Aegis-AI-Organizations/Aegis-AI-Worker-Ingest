[package]
name = "aegis-ai-worker-ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
redis = { version = "0.25", features = ["tokio-comp"] }
clickhouse = { version = "0.12" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
temporalio-sdk = "0.4"
temporalio-client = "0.4"
temporalio-sdk-core = "0.4"
temporalio-macros = "0.4"
temporalio-common = "0.4"
futures = "0.3"
futures-util = "0.3"
rust-s3 = { version = "0.33", default-features = false, features = ["tokio-rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"


